workflows:
  android-workflow:
    name: Hira Kaam History Android
    max_build_duration: 60

    environment:
      flutter: stable
      android_signing:
        - hira_keystore

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Build Android APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
